## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: ">=5.3.0"

  # Put list of dependencies here
  # For components maintained by Espressif:
  # component: "~1.0.0"
  protocol_examples_common:
    path: ${IDF_PATH}/examples/common_components/protocol_examples_common

  gmf_ai_audio:
    override_path: ../dependencies/esp-gmf/elements/gmf_ai_audio
    version: "~0.7"
    rules:
      - if: "target in [esp32p4, esp32s3, esp32]"
  esp_audio_simple_player:
    override_path: ../dependencies/esp-gmf/packages/esp_audio_simple_player
    version: "^0.9.4"
  gmf_app_utils:
    override_path: ../dependencies/esp-gmf/packages/gmf_app_utils # Note: Modified
    version: "^0.7"
  gmf_loader:
    override_path: ../dependencies/esp-gmf/packages/gmf_loader
    version: "^0.7"
  esp_coze:
    version: "^0.6"
  button:
    version: "^4.1.3"
  esp_hosted:
    version: "~1.1"
    rules:
      - if: "target in [esp32p4]"
  esp_wifi_remote:
    matches:
      - if: "idf_version <=5.4.0 && target in [esp32p4]"
        version: "~0.4"
      - if: "idf_version >5.4.0 && target in [esp32p4]"
        version: "~0.6"

  esp_lvgl_port: "^2.6.0"

  # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  lvgl/lvgl: "^9.3.0"
